        @keyframes shake {

    <script>
        // --- 1. LIVE CYBER NETWORK BACKGROUND ANIMATION ---
        (function initLiveBg() {
            const canvas = document.getElementById('liveBgCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const particleCount = window.innerWidth < 640 ? 32 : 50;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.45,
                    radius: Math.random() * 1.5 + 0.8,
                    color: Math.random() > 0.5 ? 'rgba(0, 132, 255,' : 'rgba(239, 68, 68,'
                });
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 85) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(100, 149, 237, ${0.18 * (1 - dist / 85)})`;
                            ctx.lineWidth = 0.6;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + '0.7)';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.color + '1)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                requestAnimationFrame(animate);
            }
            animate();
        })();

        // --- 2. UID VERIFICATION & CHECKOUT LOGIC ---
        let isConfirmed = false;
        let confirmedUid = "";

        // Reset state completely on page load / refresh
        window.addEventListener('DOMContentLoaded', () => {
            const uidInput = document.getElementById('playerUid');
            if (uidInput) uidInput.value = '';
            isConfirmed = false;
            confirmedUid = "";
            document.getElementById('plansSection').classList.add('hidden');
        });

        function verifyUid() {
            const uidInput = document.getElementById('playerUid');
            const uid = uidInput.value.trim();
            const loader = document.getElementById('confirmLoader');
            const btnText = document.getElementById('btnText');
            
            if (uid.length >= 8 && uid.length <= 12) {
                loader.style.display = 'block';
                btnText.innerText = "Verifying...";
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    btnText.innerText = "Verified: " + uid;
                    document.getElementById('verifyBtn').style.background = "linear-gradient(135deg, #10b981 0%, #047857 100%)"; 
                    document.getElementById('verifyBtn').style.boxShadow = "0 0 18px rgba(16, 185, 129, 0.5)";
                    isConfirmed = true;
                    confirmedUid = uid;
                    
                    localStorage.setItem('ffUid', uid);
                    localStorage.setItem('playerUid', uid);
                    
                    document.getElementById('plansSection').classList.remove('hidden');
                    document.getElementById('plansSection').scrollIntoView({ behavior: 'smooth' });
                }, 900);
            } else {
                uidInput.classList.add('error-shake');
                alert("Please enter a valid Player UID (8-12 digits).");
            }
        }

        // Top Membership Banner Direct Checkout
        function buyMembership() {
            if(!isConfirmed) {
                document.getElementById('verifyBox').scrollIntoView({behavior: 'smooth'});
                document.getElementById('playerUid').classList.add('error-shake');
                return;
            }

            const plan = "FF Monthly Membership";
            const price = "299";
            const benefits = "30 Days Daily Diamonds & Rewards, VIP Icon";

            localStorage.setItem('selectedPlan', plan);
            localStorage.setItem('selectedPrice', price);
            localStorage.setItem('planBenefits', benefits);
            localStorage.setItem('finalTarget', "UID: " + confirmedUid);
            localStorage.setItem('deliveryTime', "0.001 Second Instantly");

            window.location.href = `payment.html?bundle=${encodeURIComponent(plan)}&price=${price}&uid=${encodeURIComponent(confirmedUid)}`;
        }

        // Diamond Packs Checkout
        function buyNow(btn, plan, price, benefits) {
            if(!isConfirmed) {
                document.getElementById('verifyBox').scrollIntoView({behavior: 'smooth'});
                document.getElementById('playerUid').classList.add('error-shake');
                return;
            }

            const text = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.btn-loader');
            if(text) text.style.display = 'none';
            if(loader) loader.style.display = 'block';
            btn.style.pointerEvents = 'none';

            localStorage.setItem('selectedPlan', plan);
            localStorage.setItem('selectedPrice', price);
            localStorage.setItem('planBenefits', benefits);
            localStorage.setItem('finalTarget', "UID: " + confirmedUid);
            localStorage.setItem('deliveryTime', "0.001 Second Instantly");

            setTimeout(() => {
                window.location.href = `payment.html?bundle=${encodeURIComponent(plan)}&price=${price}&uid=${encodeURIComponent(confirmedUid)}`;
            }, 600);
        }

        // Reset buttons if user navigates back
        window.addEventListener('pageshow', function () {
            const buttons = document.querySelectorAll('.cyber-plan-btn');
            buttons.forEach(btn => {
                const text = btn.querySelector('.btn-text');
                const loader = btn.querySelector('.btn-loader');
                if (text) text.style.display = 'block';
                if (loader) loader.style.display = 'none';
                btn.style.pointerEvents = 'auto';
            });
        });
