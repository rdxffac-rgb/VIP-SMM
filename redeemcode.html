<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #05070d; 
            color: #ffffff; 
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Fullscreen Interactive Cyber Canvas Live Background */
        #liveBgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient glowing grid overlay */
        .ambient-grid {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 65%, rgba(239, 68, 68, 0.12) 0%, transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
            pointer-events: none;
            z-index: 1;
        }

        /* Premium Cyber Card */
        .premium-dark-card { 
            position: relative; 
            background: rgba(12, 16, 26, 0.9); 
            backdrop-filter: blur(12px);
            border-radius: 20px; 
            padding: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .border-glow-red {
            border-left: 4px solid #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2), inset 4px 0 12px -3px rgba(239, 68, 68, 0.4);
        }

        /* Centered 2-Column Cyber Pack Cards */
        .cyber-pack-card {
            background: rgba(12, 16, 26, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px 12px 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 195px;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 2;
            text-align: center;
        }

        .cyber-pack-card:active {
            transform: scale(0.97);
        }

        /* Glowing Neon Borders */
        .neon-green {
            border: 1.6px solid #10b981;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.35), inset 0 0 8px rgba(16, 185, 129, 0.1);
        }

        .neon-blue {
            border: 1.6px solid #0084ff;
            box-shadow: 0 0 16px rgba(0, 132, 255, 0.35), inset 0 0 8px rgba(0, 132, 255, 0.1);
        }

        .neon-purple {
            border: 1.6px solid #d946ef;
            box-shadow: 0 0 16px rgba(217, 70, 239, 0.35), inset 0 0 8px rgba(217, 70, 239, 0.1);
        }

        .neon-orange {
            border: 1.6px solid #f97316;
            box-shadow: 0 0 16px rgba(249, 115, 22, 0.35), inset 0 0 8px rgba(249, 115, 22, 0.1);
        }

        .neon-red {
            border: 1.6px solid #ef4444;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.35), inset 0 0 8px rgba(239, 68, 68, 0.1);
        }

        /* Redeem Logo Frame */
        .redeem-icon-frame {
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .redeem-icon-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.45));
            display: block;
        }

        /* Clean "Plans" Button */
        .cyber-plan-btn {
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 8px 0;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .cyber-plan-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Input Styling */
        .input-dark { 
            background: #0c0f17; 
            border-radius: 14px; 
            border: 1.5px solid rgba(255, 255, 255, 0.1); 
            color: #ffffff;
            transition: all 0.3s ease; 
        }

        .input-dark:focus { 
            border-color: #ef4444; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.35); 
            outline: none; 
        }

        .error-shake { 
            border-color: #ef4444 !important; 
            animation: shake 0.2s ease-in-out 2; 
        }

        @keyframes shake { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-6px); } 
            75% { transform: translateX(6px); } 
        }

        .btn-glow { 
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); 
            color: white; 
            border-radius: 12px; 
            font-weight: 800; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); 
            transition: all 0.2s ease; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer;
        }

        .btn-glow:active { 
            transform: scale(0.96); 
        }

        /* Loader Animation */
        .btn-loader {
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: none;
            animation: spinLoader 0.9s linear infinite;
        }

        @keyframes spinLoader {
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* Trending Blink Badge */
        .trending-badge { 
            position: absolute; 
            top: -9px; 
            right: 12px; 
            background: #ef4444; 
            color: white; 
            font-size: 8px; 
            font-weight: 900; 
            padding: 2.5px 7px; 
            border-radius: 7px; 
            animation: blink 0.8s infinite; 
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }

        @keyframes blink { 
            0% { opacity: 1; } 
            50% { opacity: 0.3; } 
            100% { opacity: 1; } 
        }
    </style>
</head>
<body class="pb-16 relative">

                    <button onclick="buyNow(this, 'Redeem Code (₹3000)', 900, '₹3000 Play Store Credit, Instant Delivery')" class="cyber-plan-btn">

    <script>
        // --- 1. LIVE CYBER NETWORK BACKGROUND ANIMATION ---
        (function initLiveBg() {
            const canvas = document.getElementById('liveBgCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const particleCount = window.innerWidth < 640 ? 32 : 50;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.45,
                    radius: Math.random() * 1.5 + 0.8,
                    color: Math.random() > 0.5 ? 'rgba(16, 185, 129,' : 'rgba(239, 68, 68,'
                });
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 85) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(52, 211, 153, ${0.18 * (1 - dist / 85)})`;
                            ctx.lineWidth = 0.6;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + '0.7)';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.color + '1)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                requestAnimationFrame(animate);
            }
            animate();
        })();

        // --- 2. EMAIL VERIFICATION & CALCULATION LOGIC ---
        let isConfirmed = false;
        let confirmedEmail = "";
        let calculatedRedeemValue = 0;

        // Reset inputs on refresh
        window.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('userEmail');
            if (emailInput) emailInput.value = '';
            isConfirmed = false;
            confirmedEmail = "";
            document.getElementById('mainSection').classList.add('hidden');
        });

        function verifyEmail() {
            const emailInput = document.getElementById('userEmail');
            const email = emailInput.value.trim();
            const loader = document.getElementById('confirmLoader');
            const btnText = document.getElementById('btnText');
            
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (emailPattern.test(email)) {
                loader.style.display = 'block';
                btnText.innerText = "Verifying Email...";
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    btnText.innerText = "Verified: " + email.split('@')[0];
                    document.getElementById('verifyBtn').style.background = "linear-gradient(135deg, #10b981 0%, #047857 100%)"; 
                    document.getElementById('verifyBtn').style.boxShadow = "0 0 18px rgba(16, 185, 129, 0.5)";
                    isConfirmed = true;
                    confirmedEmail = email;
                    
                    localStorage.setItem('userEmail', email);
                    document.getElementById('mainSection').classList.remove('hidden');
                    document.getElementById('mainSection').scrollIntoView({ behavior: 'smooth' });
                }, 900);
            } else {
                emailInput.classList.add('error-shake');
                alert("Please enter a valid Gmail address.");
            }
        }

        function triggerError() {
            const inputField = document.getElementById('customAmount');
            inputField.classList.add('error-shake');
            if (navigator.vibrate) navigator.vibrate(150);
            setTimeout(() => {
                inputField.classList.remove('error-shake');
            }, 500);
        }

        function calculateRedeem() {
            const inputField = document.getElementById('customAmount');
            let amount = parseFloat(inputField.value);
            const display = document.getElementById('redeemResult');
            
            if (isNaN(amount) || inputField.value === '') {
                display.innerText = "Enter Minimum Amount ₹100";
                display.className = "text-xs font-bold text-red-400";
                calculatedRedeemValue = 0;
                return;
            }

            if (amount > 5000) {
                triggerError();
                inputField.value = 5000;
                amount = 5000;
            }

            if (amount < 100) {
                inputField.style.borderColor = '#ef4444';
                display.innerText = "Enter Minimum Amount ₹100";
                display.className = "text-xs font-bold text-red-400";
                calculatedRedeemValue = 0;
                return;
            } else {
                inputField.style.borderColor = '';
                display.className = "text-sm font-black text-emerald-400";
            }

            // Calculation multiplier ratio
            let ratio = 2.8; 
            if (amount <= 199) ratio = 2.4;
            else if (amount <= 499) ratio = 2.6;
            
            calculatedRedeemValue = Math.floor(amount * ratio);
            display.innerText = "₹" + calculatedRedeemValue + " Google Play Code";
        }

        function buyNow(btn, plan, price, benefits) {
            if (!isConfirmed) {
                document.getElementById('verifyBox').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('userEmail').classList.add('error-shake');
                return;
            }

            let finalPrice = price;
            let finalPlan = plan;

            if (price === 'custom') {
                finalPrice = parseFloat(document.getElementById('customAmount').value);
                if (!finalPrice || finalPrice < 100 || finalPrice > 5000) {
                    triggerError();
                    document.getElementById('customAmount').style.borderColor = '#ef4444';
                    return;
                }
                finalPlan = `Custom Redeem (₹${calculatedRedeemValue})`;
            }

            const text = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.btn-loader');
            if (text) text.style.display = 'none';
            if (loader) loader.style.display = 'block';
            btn.style.pointerEvents = 'none';

            localStorage.setItem('selectedPlan', finalPlan);
            localStorage.setItem('selectedPrice', finalPrice);
            localStorage.setItem('planBenefits', benefits);
            localStorage.setItem('finalTarget', "Email: " + confirmedEmail);
            localStorage.setItem('deliveryTime', "0.001 Second Instantly");

            setTimeout(() => {
                window.location.href = `payment.html?bundle=${encodeURIComponent(finalPlan)}&price=${finalPrice}&email=${encodeURIComponent(confirmedEmail)}`;
            }, 600);
        }

        // Reset buttons on browser back
        window.addEventListener('pageshow', function () {
            const buttons = document.querySelectorAll('.cyber-plan-btn, .btn-glow');
            buttons.forEach(btn => {
                const text = btn.querySelector('.btn-text');
                const loader = btn.querySelector('.btn-loader');
                if (text) text.style.display = 'block';
                if (loader) loader.style.display = 'none';
                btn.style.pointerEvents = 'auto';
            });
        });
    </script>
