<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback | VIP SMM SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-red: #ef4444;
            --accent-indigo: #6366f1;
            --star-color: #fbbf24;
            --card-bg: rgba(12, 16, 26, 0.92);
        }

        body {
            background-color: #05070d;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 16px 12px 40px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Fullscreen Interactive Cyber Canvas Live Wallpaper */
        #liveBgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient Glowing Grid Overlay */
        .ambient-grid {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 12%, rgba(239, 68, 68, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 15% 70%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
            pointer-events: none;
            z-index: 1;
        }

        /* Main Container */
        .rating-container {
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border-radius: 26px;
            padding: 24px 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 2;
        }

        /* Top Back Header */
        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: #111420;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: transform 0.2s;
        }
        .back-btn:active { transform: scale(0.92); }

        h2 { 
            font-size: 1.25rem;
            font-weight: 900; 
            letter-spacing: 0.5px;
            color: #ffffff; 
            margin: 0;
            text-transform: uppercase;
        }

        /* YouTube Shorts Container (9:16 Aspect Ratio) */
        .video-guide-header {
            font-size: 13px;
            font-weight: 800;
            color: #f87171;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .video-guide-section {
            width: 100%;
            margin-bottom: 24px;
            background: #090c15;
            padding: 12px;
            border-radius: 22px;
            border: 1.5px solid rgba(239, 68, 68, 0.35);
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.25);
            display: flex;
            justify-content: center;
        }

        .video-container-shorts {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border-radius: 16px;
            position: relative;
            background: #000000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .video-container-shorts iframe {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0;
        }

        /* Overall Rating Badge */
        .overall-rating-badge {
            text-align: center;
            margin-bottom: 20px;
            background: #0a0d16;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 14px;
            color: #e2e8f0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .overall-rating-badge span { color: var(--star-color); font-size: 15px; margin-left: 6px; }

        /* Star Rating Interactive Input */
        .star-input {
            display: flex;
            justify-content: center;
            gap: 14px;
            font-size: 32px;
            cursor: pointer;
            margin-bottom: 22px;
        }
        .star-input i { color: #1e2433; transition: transform 0.2s ease, color 0.2s ease; }
        .star-input i.active { 
            color: var(--star-color); 
            transform: scale(1.15); 
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5));
        }

        /* Feedback Box */
        #feedback-box {
            display: none;
            background: #090c15;
            padding: 16px;
            border-radius: 18px;
            border: 1.5px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 24px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
        }

        input, textarea {
            width: 100%;
            background: #05070d;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            padding: 12px 14px;
            margin: 8px 0;
            border-radius: 12px;
            color: #ffffff;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-red);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
        }

        /* Buttons */
        .btn-submit {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            transition: transform 0.15s ease;
        }
        .btn-submit:active { transform: scale(0.97); }

        /* Review Cards */
        .review-card {
            background: #0a0d17;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s;
        }
        .user-name { font-weight: 800; color: #f1f5f9; font-size: 14px; }
        .time-ago { font-size: 11px; color: #94a3b8; float: right; font-weight: 600; }
        .review-text { margin: 8px 0; font-size: 13.5px; color: #cbd5e1; line-height: 1.5; }

        /* Official Admin Reply */
        .official-reply {
            background: #060810;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            border-left: 3.5px solid #ef4444;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .reply-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 900;
            font-size: 11px;
            color: #ef4444;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .blue-tick { color: #38bdf8; font-size: 12px; }
        .reply-text { font-size: 12.5px; color: #e2e8f0; margin: 0; font-weight: 500; }

        .actions { 
            display: flex; 
            gap: 16px; 
            margin-top: 8px; 
            border-top: 1px solid rgba(255, 255, 255, 0.05); 
            padding-top: 8px; 
        }
        .action-btn { 
            cursor: pointer; 
            color: #64748b; 
            font-size: 12px; 
            font-weight: 700; 
            transition: color 0.2s;
        }
        .action-btn.liked { color: #ef4444; }

        /* Loaders */
        .loader { display: none; text-align: center; padding: 16px; }
        .spinner {
            border: 2.5px solid rgba(255, 255, 255, 0.1);
            border-top: 2.5px solid var(--accent-red);
            border-radius: 50%;
            width: 26px; 
            height: 26px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .see-more-container { text-align: center; margin-top: 16px; }
    </style>
</head>
<body>

<!-- Live Animated Canvas Background -->
<canvas id="liveBgCanvas"></canvas>
<div class="ambient-grid"></div>

<div class="rating-container">

    <!-- Top Header Nav -->
    <div class="header-nav">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left text-xs"></i>
        </a>
        <h2>Customer Feedback</h2>
        <div class="w-8 h-8 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center">
            <i class="fa-solid fa-star text-red-500 text-xs"></i>
        </div>
    </div>

    <!-- YouTube Shorts Tutorial Guide (Vertical 9:16) -->
    <div class="video-guide-header">
        <i class="fa-brands fa-youtube text-red-500 text-base"></i> Watch Tutorial Shorts
    </div>

    <div class="video-guide-section">
        <div class="video-container-shorts">
            <iframe 
                src="https://www.youtube.com/embed/mM8HRHmUCo8?autoplay=0&rel=0&modestbranding=1" 
                title="Tutorial Shorts" 
                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Overall Rating Badge -->
    <div class="overall-rating-badge">
        Overall Rating: 4.8 <span><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span>
    </div>
    
    <!-- Star Input -->
    <div class="star-input" id="star-selector">
        <i class="fa-solid fa-star" data-val="1"></i>
        <i class="fa-solid fa-star" data-val="2"></i>
        <i class="fa-solid fa-star" data-val="3"></i>
        <i class="fa-solid fa-star" data-val="4"></i>
        <i class="fa-solid fa-star" data-val="5"></i>
    </div>

    <!-- User Feedback Form -->
    <div id="feedback-box">
        <input type="text" id="inp-name" placeholder="Enter Your Name">
        <textarea id="inp-comment" rows="3" placeholder="Share your experience..."></textarea>
        <button class="btn-submit" onclick="handleUserRating()">SUBMIT RATING</button>
    </div>

    <div id="main-loader" class="loader">
        <div class="spinner"></div>
        <p class="text-xs text-gray-400 mt-2">Verifying your review...</p>
    </div>

    <!-- Live Dynamic Feed -->
    <div id="reviews-feed"></div>

    <div class="see-more-container">
        <button class="btn-submit !w-auto !py-2.5 !px-8 text-xs" id="btn-load-more" onclick="loadMoreReviews()">SEE MORE</button>
        <div id="more-loader" class="loader"><div class="spinner"></div></div>
    </div>
</div>

<script>
    // --- 1. LIVE CYBER NETWORK BACKGROUND ANIMATION ---
    (function initLiveBg() {
        const canvas = document.getElementById('liveBgCanvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particleCount = window.innerWidth < 640 ? 30 : 45;
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.45,
                vy: (Math.random() - 0.5) * 0.45,
                radius: Math.random() * 1.5 + 0.8,
                color: Math.random() > 0.5 ? 'rgba(99, 102, 241,' : 'rgba(239, 68, 68,'
            });
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 85) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(165, 180, 252, ${0.16 * (1 - dist / 85)})`;
                        ctx.lineWidth = 0.6;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + '0.7)';
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color + '1)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(animate);
        }
        animate();
    })();

    // --- 2. REVIEW GENERATOR & FEEDBACK LOGIC ---
    const firstNames = ["Aman", "Rohan", "Suresh", "Priya", "Sneha", "Vikram", "Anjali", "Deepak", "Manish", "Sahil", "Neha", "Aaryan", "Suhani", "Mohit", "Ishaan", "Pooja", "Arjun", "Vivek", "Karan", "Kavita", "Abhishek", "Rahul", "Sumit", "Riya", "Komal"];
    const lastNames = ["Sharma", "Verma", "Singh", "Yadav", "Gupta", "Rajput", "Meena", "Kumar", "Choudhary", "Das", "Patel", "Mishra", "Joshi", "Bhatt", "Tiwari"];
    
    const positiveTemplates = [
        "Instantly {service} mil gaye, bahut sahi site hai.",
        "{service} ke liye best panel hai, turant kaam hota hai.",
        "Sabse sasti {service} yahan hi milti hai, recommended!",
        "Maza aa gaya! {service} 5 minute mein credit ho gaye.",
        "Trustworthy site. {service} quality is non-drop.",
        "Bhai mast service hai, {service} instantly mil gaye.",
        "Link verify kiya aur {service} start ho gaye, amazing!",
        "VIP SMM is real, {service} working fine.",
        "QR code se payment kiya aur {service} turant mil gaye.",
        "Maine {service} order kiye the, 2 minute me aa gaye.",
        "Best for {service}, support team is very helpful.",
        "Paisa vasool! {service} price bahut kam hai.",
        "Finally a genuine site for {service}.",
        "Recharge process fast hai, {service} mil gaya turant.",
        "Professional quality services, specially for {service}."
    ];

    const services = [
        "Instagram Followers", "YouTube Watchtime", "Jio Recharge", "Airtel Recharge",
        "Free Fire Diamonds", "Weekly Membership", "Amazon Prime Subscription", 
        "Play Store Redeem Code", "Facebook Likes", "Instagram Reels Views",
        "YouTube Subscribers", "Monthly Membership", "Discord Nitro"
    ];

    const complaintTemplates = [
        "Mera {service} aane mein 2 ghante lag gaye, thoda fast karo please.",
        "Bhai order kiya tha par 1 ghante baad {service} mile.",
        "Service thodi slow hai, 3 ghante baad {service} start huye.",
        "Wait karna pada kaafi, 1.5 ghante baad {service} mile."
    ];

    const highRatingReplies = [
        "Shukriya! Hum hamesha best service dene ki koshish karte hain.",
        "Thanks for your feedback! Keep using VIPSMM.",
        "Great choice! Agli baar aapko aur bhi fast delivery milegi.",
        "Glad you liked it! Do share with your friends.",
        "Aapka feedback hamare liye bahut keemti hai."
    ];

    const timesPool = ["1 hour ago", "3 hours ago", "8 hours ago", "1 day ago", "2 days ago", "4 days ago", "1 week ago", "2 weeks ago", "1 month ago"];

    let usedNames = new Set();
    let reviewCount = 0;

    function getUniqueName() {
        let name;
        do {
            name = firstNames[Math.floor(Math.random() * firstNames.length)] + " " + lastNames[Math.floor(Math.random() * lastNames.length)];
        } while (usedNames.has(name));
        usedNames.add(name);
        return name;
    }

    function generateReview() {
        reviewCount++;
        const isComplaint = reviewCount % 15 === 0;
        
        const name = getUniqueName();
        const time = timesPool[Math.floor(Math.random() * timesPool.length)];
        const service = services[Math.floor(Math.random() * services.length)];
        
        let text, stars, replyHTML;

        if (isComplaint) {
            text = complaintTemplates[Math.floor(Math.random() * complaintTemplates.length)].replace("{service}", service);
            stars = Math.random() < 0.5 ? 1 : 2;
            replyHTML = `
                <div class="official-reply">
                    <div class="reply-header">
                        <i class="fa-solid fa-circle-check blue-tick"></i> VIPSMM OFFICIAL REPLY
                    </div>
                    <p class="reply-text">We sincerely apologize for the delay. Your feedback is very important to us, and we are working hard to improve our delivery speed. Thank you for your patience.</p>
                </div>`;
        } else {
            text = positiveTemplates[Math.floor(Math.random() * positiveTemplates.length)].replace("{service}", service);
            stars = 5;
            const shouldReply = Math.random() < 0.3;
            replyHTML = shouldReply ? `
                <div class="official-reply">
                    <div class="reply-header">
                        <i class="fa-solid fa-circle-check blue-tick"></i> VIPSMM OFFICIAL REPLY
                    </div>
                    <p class="reply-text">${highRatingReplies[Math.floor(Math.random() * highRatingReplies.length)]}</p>
                </div>` : '';
        }

        let starsHTML = '';
        for (let i = 1; i <= 5; i++) {
            starsHTML += i <= stars ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star" style="color:#334155"></i>';
        }

        const likes = Math.floor(Math.random() * 1200) + 50;

        return { name, time, text, starsHTML, replyHTML, likes };
    }

    function injectReviews(n) {
        const f = document.getElementById('reviews-feed');
        for(let i=0; i<n; i++) {
            const r = generateReview();
            const div = document.createElement('div');
            div.className = 'review-card';
            div.innerHTML = `
                <div><span class="user-name">${r.name}</span><span class="time-ago">${r.time}</span></div>
                <div style="color:var(--star-color); font-size:11px; margin:5px 0;">${r.starsHTML}</div>
                <p class="review-text">${r.text}</p>
                ${r.replyHTML}
                <div class="actions">
                    <span class="action-btn" onclick="this.classList.add('liked');">
                        <i class="fa-solid fa-thumbs-up"></i> <span>${r.likes}</span>
                    </span>
                </div>
            `;
            f.appendChild(div);
        }
    }

    // Star Selector UI
    const starsUI = document.querySelectorAll('.star-input i');
    starsUI.forEach(s => {
        s.addEventListener('click', () => {
            const v = s.getAttribute('data-val');
            starsUI.forEach((st, i) => st.classList.toggle('active', i < v));
            document.getElementById('feedback-box').style.display = 'block';
        });
    });

    function handleUserRating() {
        const n = document.getElementById('inp-name').value;
        if(!n) return alert("Please enter your name!");
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('main-loader').style.display = 'block';
        setTimeout(() => {
            document.getElementById('main-loader').innerHTML = `<h3 class="text-sm font-bold text-emerald-400">✅ Thank you for your feedback, ${n}!</h3>`;
            setTimeout(() => location.reload(), 2000);
        }, 1500);
    }

    function loadMoreReviews() {
        document.getElementById('btn-load-more').style.display = 'none';
        document.getElementById('more-loader').style.display = 'block';
        setTimeout(() => {
            document.getElementById('more-loader').style.display = 'none';
            document.getElementById('btn-load-more').style.display = 'inline-block';
            injectReviews(5);
        }, 800);
    }

    window.onload = () => injectReviews(10);
</script>

</body>
</html>
